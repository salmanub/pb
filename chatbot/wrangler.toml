name = "perito-barcelona-chatbot"
main = "worker.js"
compatibility_date = "2025-12-26"

# Variables de entorno se cargan automáticamente desde .dev.vars en desarrollo
# Para producción, configurar estos valores como secrets en Cloudflare Dashboard:
# - SPREADSHEET_ID
# - GOOGLE_SERVICE_ACCOUNT_EMAIL
# - GOOGLE_PRIVATE_KEY
# - SHEETS_API_KEY
# - OPENAI_API_KEY
# - EMAIL_DESTINO

# KV Namespaces para sesiones persistentes (opcional, mejorar performance)
kv_namespaces = [
  { binding = "PERITO_SESSIONS", id = "13e999d7257b44e09c8808eada9dd2b6" }
]

# Routes para custom domain
# routes = [
#   { pattern = "perito.barcelona/api/*", zone_name = "perito.barcelona" }
# ]

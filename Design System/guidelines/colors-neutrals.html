<!-- @dsCard group="Colors" viewport="700x180" name="Neutros — ink & piedra" subtitle="Espina neutra fría (gris-verdosa): ink → concrete → stone → bone → paper" -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background:var(--surface-page); padding:24px; font-family:var(--font-mono); }
  .row { display:flex; gap:14px; }
  .sw { flex:1; }
  .chip { height:64px; border-radius:var(--radius-sm); border:1px solid var(--border-subtle); }
  .name { margin-top:10px; font-size:11px; letter-spacing:0.04em; color:var(--text-strong); text-transform:uppercase; }
  .hex { margin-top:2px; font-size:11px; color:var(--text-faint); }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="name">ink-900</div><div class="hex">#18211C</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-700)"></div><div class="name">ink-700</div><div class="hex">#34403A</div></div>
    <div class="sw"><div class="chip" style="background:var(--concrete-600)"></div><div class="name">concrete-600</div><div class="hex">#5E665F</div></div>
    <div class="sw"><div class="chip" style="background:var(--stone-400)"></div><div class="name">stone-400</div><div class="hex">#AEB4AE</div></div>
    <div class="sw"><div class="chip" style="background:var(--stone-300)"></div><div class="name">stone-300</div><div class="hex">#D5DAD5</div></div>
    <div class="sw"><div class="chip" style="background:var(--bone-100)"></div><div class="name">bone-100</div><div class="hex">#F1F1EA</div></div>
    <div class="sw"><div class="chip" style="background:var(--paper-50)"></div><div class="name">paper-50</div><div class="hex">#FAFAF4</div></div>
  </div>
</body></html>

<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:0; display:flex; font-family:var(--font-sans); }
  .panel { flex:1; padding:26px 24px; min-height:138px; }
  .bone { background:var(--bone-100); }
  .ink { background:var(--ink-900); }
  .oxide { background:var(--oxide-500); }
  .k { font-family:var(--font-mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase; }
  h4 { font-family:var(--font-serif); font-weight:400; font-size:1.4rem; margin:12px 0 0; }
</style></head>
<body>
  <div class="panel bone" style="flex:2;">
    <span class="k" style="color:var(--oxide-500);">Ground · piedra</span>
    <h4 style="color:var(--ink-900);">Sobriedad serena,<br>no azul corporativo.</h4>
  </div>
  <div class="panel ink">
    <span class="k" style="color:var(--text-on-dark-muted);">Ink</span>
    <h4 style="color:var(--bone-100); font-size:1.1rem;">Gravedad</h4>
  </div>
  <div class="panel oxide">
    <span class="k" style="color:rgba(241,241,234,0.82);">Verde inglés</span>
    <h4 style="color:var(--bone-100); font-size:1.1rem;">El acento</h4>
  </div>
</body></html>

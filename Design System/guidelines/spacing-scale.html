<!-- @dsCard group="Spacing" viewport="700x220" name="Spacing scale" subtitle="4px base grid — generous air signals gravity" -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background:var(--surface-page); padding:28px; font-family:var(--font-mono); }
  .r { display:flex; align-items:center; gap:16px; padding:5px 0; }
  .bar { height:14px; background:var(--oxide-500); border-radius:1px; }
  .tok { font-size:11px; color:var(--text-strong); width:96px; }
  .val { font-size:11px; color:var(--text-faint); }
</style></head>
<body>
  <div class="r"><span class="tok">--space-1</span><span class="bar" style="width:4px;"></span><span class="val">4px</span></div>
  <div class="r"><span class="tok">--space-2</span><span class="bar" style="width:8px;"></span><span class="val">8px</span></div>
  <div class="r"><span class="tok">--space-4</span><span class="bar" style="width:16px;"></span><span class="val">16px</span></div>
  <div class="r"><span class="tok">--space-6</span><span class="bar" style="width:24px;"></span><span class="val">24px</span></div>
  <div class="r"><span class="tok">--space-8</span><span class="bar" style="width:32px;"></span><span class="val">32px</span></div>
  <div class="r"><span class="tok">--space-12</span><span class="bar" style="width:48px;"></span><span class="val">48px</span></div>
  <div class="r"><span class="tok">--space-16</span><span class="bar" style="width:64px;"></span><span class="val">64px</span></div>
  <div class="r"><span class="tok">--space-24</span><span class="bar" style="width:96px;"></span><span class="val">96px</span></div>
</body></html>

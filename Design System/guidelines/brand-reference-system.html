<!-- @dsCard group="Brand" viewport="700x210" name="The reference-code system" subtitle="Mono marginalia turns every page into a dossier" -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background:var(--surface-page); padding:28px; }
  .sheet { border:1px solid var(--border-hairline); background:var(--paper-50); border-radius:var(--radius-md); padding:22px 24px; position:relative; }
  .corner { position:absolute; top:10px; right:14px; font-family:var(--font-mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-faint); }
  .eyebrow { font-family:var(--font-mono); font-size:0.75rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-accent); font-weight:500; display:flex; align-items:center; gap:10px; }
  .eyebrow::before { content:''; width:22px; height:1.5px; background:var(--oxide-500); }
  h3 { font-family:var(--font-serif); font-size:1.5rem; color:var(--text-strong); margin:14px 0 0; font-weight:400; }
  p { font-family:var(--font-sans); font-size:0.9rem; color:var(--text-muted); margin:10px 0 0; max-width:48ch; }
</style></head>
<body>
  <div class="sheet">
    <div class="corner">Pieza 01 / 04</div>
    <div class="eyebrow">§ 02 · Servicios periciales</div>
    <h3>Vicios ocultos y patología de la edificación</h3>
    <p>El número de expediente, la sección y el estado acompañan a cada bloque. La marca habla el idioma del informe pericial.</p>
  </div>
</body></html>

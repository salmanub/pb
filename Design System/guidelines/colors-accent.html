<!-- @dsCard group="Colors" viewport="700x180" name="Acento — verde inglés" subtitle="El acento único: verde inglés vivo. Tradición jurídica, permanencia, distintivo." -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background:var(--surface-page); padding:24px; font-family:var(--font-mono); }
  .row { display:flex; gap:14px; }
  .sw { flex:1; }
  .chip { height:64px; border-radius:var(--radius-sm); border:1px solid var(--border-subtle); }
  .name { margin-top:10px; font-size:11px; letter-spacing:0.04em; color:var(--text-strong); text-transform:uppercase; }
  .hex { margin-top:2px; font-size:11px; color:var(--text-faint); }
  .role { margin-top:2px; font-size:10px; color:var(--text-muted); text-transform:none; letter-spacing:0; }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--oxide-700)"></div><div class="name">verde-700</div><div class="hex">#11502F</div></div>
    <div class="sw"><div class="chip" style="background:var(--oxide-600)"></div><div class="name">verde-600</div><div class="role">pressed</div></div>
    <div class="sw"><div class="chip" style="background:var(--oxide-500)"></div><div class="name">verde-500</div><div class="role">accent</div></div>
    <div class="sw"><div class="chip" style="background:var(--oxide-400)"></div><div class="name">verde-400</div><div class="role">hover</div></div>
    <div class="sw"><div class="chip" style="background:var(--oxide-200)"></div><div class="name">verde-200</div><div class="role">tint border</div></div>
    <div class="sw"><div class="chip" style="background:var(--oxide-100)"></div><div class="name">verde-100</div><div class="role">tint surface</div></div>
  </div>
</body></html>

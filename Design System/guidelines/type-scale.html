<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="Display → body → caption, with token names" -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background:var(--surface-page); padding:28px; }
  .r { display:flex; align-items:baseline; gap:18px; padding:7px 0; border-bottom:1px solid var(--border-subtle); }
  .t { font-family:var(--font-serif); color:var(--text-strong); flex:1; line-height:1.1; }
  .tok { font-family:var(--font-mono); font-size:11px; color:var(--text-faint); letter-spacing:0.04em; white-space:nowrap; }
</style></head>
<body>
  <div class="r"><span class="t" style="font-size:2.6rem;">Display 1</span><span class="tok">--fs-display-1</span></div>
  <div class="r"><span class="t" style="font-size:2rem;">Display 2</span><span class="tok">--fs-display-2</span></div>
  <div class="r"><span class="t" style="font-size:1.6rem;">Heading 1</span><span class="tok">--fs-h1</span></div>
  <div class="r"><span class="t" style="font-size:1.3rem;">Heading 3</span><span class="tok">--fs-h3</span></div>
  <div class="r"><span class="t" style="font-family:var(--font-sans); font-size:1.2rem; color:var(--text-body);">Lede paragraph</span><span class="tok">--fs-lede</span></div>
  <div class="r"><span class="t" style="font-family:var(--font-sans); font-size:1rem; color:var(--text-body);">Body 16px</span><span class="tok">--fs-body</span></div>
  <div class="r"><span class="t" style="font-family:var(--font-mono); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.14em; color:var(--text-muted);">Mono label</span><span class="tok">--fs-mono-label</span></div>
</body></html>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
const DSNS = window.VilardellPeritajeForenseDesignSystem_58f0b0;

const INTAKE_STEPS = [
  { key: 'problema', eyebrow: '§ 01 · Tu situación', type: 'choice',
    question: '¿Qué está pasando en tu inmueble?',
    helper: 'Elige lo que más se acerque. Después podrás detallarlo.',
    options: ['Humedades o filtraciones', 'Grietas, fisuras o movimientos', 'Vicios ocultos tras comprar', 'Reforma u obra mal ejecutada', 'Otro problema constructivo'] },
  { key: 'inmueble', eyebrow: '§ 02 · El inmueble', type: 'choice',
    question: '¿De qué tipo de inmueble hablamos?',
    options: ['Vivienda particular', 'Comunidad de propietarios', 'Local o nave', 'Edificio u obra pública'] },
  { key: 'antiguedad', eyebrow: '§ 03 · Desde cuándo', type: 'choice',
    question: '¿Desde cuándo aparece el problema?',
    helper: 'Nos ayuda a valorar plazos de garantía y responsabilidad.',
    options: ['Menos de 6 meses', 'Entre 6 meses y 2 años', 'Más de 2 años', 'No lo sé con certeza'] },
  { key: 'contacto', eyebrow: '§ 04 · Contacto', type: 'fields',
    question: '¿Cómo te contactamos?',
    helper: 'Una primera consulta sin coste. Respondemos en 24 h laborables.',
    fields: [
      { name: 'nombre', label: 'Nombre y apellidos', placeholder: 'Tu nombre' },
      { name: 'poblacion', label: 'Población del inmueble', placeholder: 'Ej. Barcelona' },
      { name: 'email', label: 'Correo electrónico', type: 'email', placeholder: 'nombre@correo.com' },
      { name: 'telefono', label: 'Teléfono', type: 'tel', optional: true, placeholder: '+34 ___ ___ ___' },
      { name: 'detalle', label: 'Cuéntanoslo en una línea', multiline: true, rows: 3, optional: true, placeholder: 'Lo que creas relevante…' },
    ] },
];

function Intake({ open, onClose }) {
  useEffect(() => {
    function onKey(e) { if (e.key === 'Escape') onClose(); }
    if (open) { document.addEventListener('keydown', onKey); document.body.style.overflow = 'hidden'; }
    return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
  }, [open]);
  if (!open) return null;
  const { StepForm } = DSNS;
  return (
    <div onClick={onClose} style={{
      position: 'fixed', inset: 0, zIndex: 100, background: 'rgba(28,26,23,0.55)',
      backdropFilter: 'blur(3px)', display: 'flex', alignItems: 'flex-start', justifyContent: 'center',
      padding: '6vh 20px 48px', overflowY: 'auto', animation: 'om-fade var(--dur-base) var(--ease-out)',
    }}>
      <div onClick={(e) => e.stopPropagation()} style={{
        width: '100%', maxWidth: '560px', boxShadow: 'var(--shadow-overlay)', borderRadius: 'var(--radius-md)',
        animation: 'om-rise var(--dur-slow) var(--ease-out)',
      }}>
        <StepForm onClose={onClose} title="Cuéntanos tu caso" steps={INTAKE_STEPS} />
      </div>
    </div>
  );
}

function App() {
  const [page, setPage] = useState('home');
  const [target, setTarget] = useState(null);
  const [intake, setIntake] = useState(false);

  function go(dest, hash) {
    if (dest === 'intake') { setIntake(true); return; }
    setPage(dest);
    setTarget({ h: hash || null, n: Date.now() });
  }

  useEffect(() => {
    if (!target) return;
    const id = requestAnimationFrame(() => {
      if (target.h) {
        const el = document.getElementById(target.h);
        if (el) { window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 84, behavior: 'smooth' }); return; }
      }
      window.scrollTo({ top: 0, behavior: 'auto' });
    });
    return () => cancelAnimationFrame(id);
  }, [target]);

  const open = () => setIntake(true);
  const svc = page.startsWith('svc-') ? (window.SVCS || []).find((s) => s.slug === page.slice(4)) : null;
  const PageMap = { home: window.HomePage, construccion: window.Construccion, informes: window.Informes, casos: window.Casos, abogados: window.Abogados, honorarios: window.Honorarios, despacho: window.Despacho, contacto: window.Contacto };
  const Page = PageMap[page] || window.HomePage;
  return (
    <React.Fragment>
      <window.SiteHeader go={go} active={page} />
      <main>{svc ? <window.Svc svc={svc} go={go} open={open} /> : <Page go={go} open={open} />}</main>
      <window.SiteFooter go={go} />
      <Intake open={intake} onClose={() => setIntake(false)} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

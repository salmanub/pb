# keepalive.yml — perito.barcelona
# ---------------------------------------------------------------------------
# PROBLEMA QUE RESUELVE
# GitHub Actions DESACTIVA automáticamente los workflows con `schedule:` (cron)
# cuando el repositorio no registra actividad (commits) durante 60 días.
# Si eso ocurre, el rebuild diario de `deploy-sxg.yml` deja de ejecutarse y
# los posts programados dejan de publicarse solos.
#
# SOLUCIÓN
# Este workflow se ejecuta una vez por semana y, cuando detecta que el último
# commit está cerca del límite de inactividad, hace un commit "vacío" que
# reinicia el contador. Así los crons (incluido el de publicación) NUNCA se
# desactivan, sin intervención humana.
#
# CÓMO
# Con el token del propio workflow (`permissions: contents: write`) y seis
# líneas de shell. Antes lo hacía `gautamkrishnar/keepalive-workflow`, que
# GitHub bloqueó por ToS en abril de 2025: como Actions resuelve todas las
# acciones antes de ejecutar nada, ese `uses:` tumbaba el job entero.
# ---------------------------------------------------------------------------

name: Keepalive (mantener crons activos)

on:
  schedule:
    - cron: '0 3 * * 1'   # Lunes 03:00 UTC (~05:00 Europe/Madrid)
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions

permissions:
  actions: write
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reiniciar el contador de inactividad
        run: |
          # GitHub DESACTIVA los workflows con `schedule:` cuando el repositorio
          # pasa 60 días sin commits. Esto reinicia ese contador con un commit
          # vacío, y solo cuando de verdad hace falta.
          #
          # Antes lo hacía `gautamkrishnar/keepalive-workflow`, que GitHub
          # bloqueó por ToS (abril de 2025): al resolver las acciones antes de
          # empezar, ese `uses:` daba «Repository access blocked» y tumbaba el
          # job entero aunque este paso ni siquiera llegara a correr. Son seis
          # líneas de shell; no hacía falta una dependencia para esto.
          dias=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Último commit hace $dias días."
          if [ "$dias" -ge 45 ]; then
            git config user.name "perito-keepalive-bot"
            git config user.email "info@perito.barcelona"
            git commit --allow-empty -m "chore: keepalive para mantener activo el cron de publicación"
            git push
          else
            echo "Faltan $(( 45 - dias )) días para que haga falta: no se toca nada."
          fi

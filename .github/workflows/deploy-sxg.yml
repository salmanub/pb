
name: Cloudflare Pages & SXG Deployment

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 0 * * 1' # Renew check weekly
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write
  deployments: write

env:
  DOMAIN: perito.barcelona

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      # --- CERTIFICATE MANAGEMENT (ACME.SH + GTS) ---
      - name: Install acme.sh
        run: |
          wget -O -  https://get.acme.sh | sh -s email=info@perito.barcelona
          
      - name: Issue/Renew Certificate (GTS) with Auto-Recovery
        env:
          CF_Token: ${{ secrets.CF_DNS_API_TOKEN }}
          CF_Account_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p .certs
          
          # Restore certs from secrets if available
          rm -rf .certs
          mkdir -p .certs

          # Attempt 1: Register with existing secrets
          set +e
          ~/.acme.sh/acme.sh --register-account \
            --server google \
            --eab-kid "${{ secrets.GTS_EAB_KID }}" \
            --eab-hmac-key "${{ secrets.GTS_EAB_HMAC }}" \
            --email info@perito.barcelona
          REG_STATUS=$?
          set -e

          # If registration failed, try to fetch new EAB credentials
          if [ $REG_STATUS -ne 0 ]; then
             echo "⚠️ Registration failed or keys expired. Attempting to fetch new EAB credentials via Service Account..."
             
             if [ -z "$GOOGLE_SERVICE_ACCOUNT_EMAIL" ] || [ -z "$GOOGLE_PRIVATE_KEY" ]; then
                echo "❌ Cannot fetch new EAB: Missing Google Service Account secrets."
                exit 1
             fi

             # Run fetch script and capture the last line (JSON)
             EAB_JSON=$(node src/scripts/fetch-gts-eab.js | tail -n 1)
             
             # Parse JSON using node
             NEW_KID=$(echo "$EAB_JSON" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf-8")).keyId)')
             NEW_HMAC=$(echo "$EAB_JSON" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf-8")).b64MacKey)')
             
             if [ -z "$NEW_KID" ] || [ "$NEW_KID" == "undefined" ]; then
                echo "❌ Failed to parse new EAB credentials."
                exit 1
             fi

             echo "✅ Obtained new EAB Key ID: ${NEW_KID:0:5}..."
             
             # Attempt 2: Register with new credentials
             ~/.acme.sh/acme.sh --register-account \
                --server google \
                --eab-kid "$NEW_KID" \
                --eab-hmac-key "$NEW_HMAC" \
                --email info@perito.barcelona

             # Update GitHub Secrets for future runs
             gh secret set GTS_EAB_KID --body "$NEW_KID" --repo "${{ github.repository }}"
             gh secret set GTS_EAB_HMAC --body "$NEW_HMAC" --repo "${{ github.repository }}"
             echo "✅ GitHub Secrets updated with new EAB credentials."
          fi

          # Issue or Renew Certificate
          # Generate/Ensure Private Key
          openssl ecparam -name prime256v1 -genkey -noout -out .certs/privkey.pem

          # Generate CSR with CanSignHttpExchanges extension (OID: 1.3.6.1.4.1.11129.2.1.22)
          # IMPORTANT: Must include SAN (Subject Alternative Name) or CA might reject/modify it.
          cat > sxg_openssl.cnf <<EOF
          [ req ]
          distinguished_name = req_distinguished_name
          req_extensions = v3_req
          prompt = no

          [ req_distinguished_name ]
          CN = $DOMAIN

          [ v3_req ]
          subjectAltName = DNS:$DOMAIN
          1.3.6.1.4.1.11129.2.1.22 = ASN1:NULL
          EOF

          openssl req -new -key .certs/privkey.pem -out .certs/domain.csr -config sxg_openssl.cnf

          # Issue Cert using CSR
          ~/.acme.sh/acme.sh --signcsr \
            --csr .certs/domain.csr \
            --server google \
            --dns dns_cf \
            --force \
            --fullchain-file .certs/fullchain.pem \
            --cert-file      .certs/cert.pem \
            --ca-file        .certs/ca.pem

          # If successful, export certs to secrets
          if [ -f .certs/privkey.pem ]; then
             echo "✅ Certificate obtained successfully."
             # Use gh cli to update secrets
             if [ -z "$GH_TOKEN" ]; then echo "Warning: GH_PAT not set, skipping secret update"; else
                 gh secret set SXG_CERT_PEM < .certs/cert.pem --repo "${{ github.repository }}"
                 gh secret set SXG_KEY_PEM < .certs/privkey.pem --repo "${{ github.repository }}"
             fi
          fi

      # --- PREPARE CONTENT & CERT.CBOR ---
      - name: Install gen-certurl
        run: |
          # Install Go if needed
          if ! command -v go &> /dev/null; then
             sudo apt-get update && sudo apt-get install -y golang-go
          fi
          go install github.com/WICG/webpackage/go/signedexchange/cmd/gen-certurl@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Generate cert.cbor for Pages
        run: |
          if [ ! -f ".certs/privkey.pem" ]; then
             echo "No private key found, skipping."
             exit 0
          fi

          # Extract OCSP
          OCSP_URI=$(openssl x509 -noout -ocsp_uri -in .certs/cert.pem)
          echo "OCSP URI: $OCSP_URI"
          
          # Fetch OCSP
          openssl ocsp -issuer .certs/ca.pem \
                       -cert .certs/cert.pem \
                       -url "$OCSP_URI" \
                       -respout .certs/ocsp.resp \
                       -noverify || echo "Warning: OCSP fetch failed"

          echo "Generating cert.cbor..."
          # Note: We use fullchain for the CBOR
          if [ -f .certs/ocsp.resp ]; then
             gen-certurl -pem .certs/fullchain.pem -ocsp .certs/ocsp.resp > dist/cert.cbor
          else
             gen-certurl -pem .certs/fullchain.pem > dist/cert.cbor
          fi

      - name: Deploy Content to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: pb
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # --- SXG WORKER DEPLOYMENT (sxg-rs) ---
      - name: Setup Rust for Worker
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Checkout sxg-rs
        uses: actions/checkout@v4
        with:
          repository: google/sxg-rs
          path: sxg-rs

      - name: Build sxg-rs Worker
        working-directory: sxg-rs/cloudflare_worker
        run: |
          wasm-pack build --target no-modules

      - name: Configure Worker (wrangler.toml)
        working-directory: sxg-rs/cloudflare_worker
        run: |
          cat > wrangler.toml <<EOF
          name = "sxg-signer"
          main = "worker.js"
          compatibility_date = "2023-01-01"
          account_id = "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          workers_dev = false
          
          # Route traffic from perito.barcelona to this worker
          [[routes]]
          pattern = "perito.barcelona/*"
          zone_name = "perito.barcelona"

          [vars]
          HTML_HOST = "pb.pages.dev"
          CERT_URL = "https://perito.barcelona/cert.cbor"
          VALIDITY_URL = "https://perito.barcelona/resource.validity.msg"
          EOF

      - name: Deploy Worker & Upload Secrets
        working-directory: sxg-rs/cloudflare_worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Install wrangler locally to avoid global version issues
          npm install wrangler

          # 1. Deploy worker code
          npx wrangler deploy

          # 2. Upload Secrets (Cert & Key)
          # Piping secrets prevents them from being logged
          npx wrangler secret put SXG_PRIVATE_KEY_PEM < ../../.certs/privkey.pem
          npx wrangler secret put SXG_CERT_CHAIN_PEM < ../../.certs/fullchain.pem

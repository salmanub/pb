
name: Cloudflare Pages & SXG Deployment

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 0 */6 * *' # Renew check every 6 days
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write
  deployments: write

env:
  DOMAIN: perito.barcelona

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      # --- CERTIFICATE MANAGEMENT (ACME.SH + GTS) ---
      - name: Install acme.sh
        run: |
          wget -O -  https://get.acme.sh | sh -s email=info@perito.barcelona
          
      - name: Issue/Renew Certificate (GTS) with Auto-Recovery
        env:
          CF_Token: ${{ secrets.CF_DNS_API_TOKEN }}
          CF_Account_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SXG_CERT_PEM: ${{ secrets.SXG_CERT_PEM }}
          SXG_KEY_PEM: ${{ secrets.SXG_KEY_PEM }}
          SXG_CA_PEM: ${{ secrets.SXG_CA_PEM }}
        run: |
          # Authenticate gh CLI with PAT (GITHUB_TOKEN lacks secret-write scope)
          echo "$GH_TOKEN" | gh auth login --with-token 2>/dev/null || echo "⚠️ gh auth login failed (GH_PAT may be invalid)"
          mkdir -p .certs
          
          # 1. Try to reuse existing valid certs from secrets
          echo "$SXG_CERT_PEM" > .certs/cert.pem
          echo "$SXG_KEY_PEM" > .certs/privkey.pem
          
          NEED_RENEW=true
          if [ -s .certs/cert.pem ] && [ -s .certs/privkey.pem ]; then
             # Check if cert is valid for at least 15 more days (1296000 seconds)
             if openssl x509 -checkend 1296000 -noout -in .certs/cert.pem; then
                echo "✅ Existing certificate is valid for >15 days. Skipping renewal."
                NEED_RENEW=false
             else
                echo "⚠️ Certificate is expiring soon or invalid. Renewing..."
             fi
          else
             echo "⚠️ No existing certificate found. issuing new one..."
          fi
          
          # 2. Renew if needed
          if [ "$NEED_RENEW" = true ]; then
            
            # Use strict error handling only for critical parts
            set +e 

            # Attempt 1: Register with existing secrets (if account exists, this is fast/idempotent)
            ~/.acme.sh/acme.sh --register-account \
              --server https://dv-sxg.acme-v02.api.pki.goog/directory \
              --eab-kid "${{ secrets.GTS_EAB_KID }}" \
              --eab-hmac-key "${{ secrets.GTS_EAB_HMAC }}" \
              --email info@perito.barcelona
            REG_STATUS=$?
            set -e

            # If registration failed, try to fetch new EAB credentials
            if [ $REG_STATUS -ne 0 ]; then
               echo "⚠️ Registration failed or keys expired. Attempting to fetch new EAB credentials..."
               
               if [ -z "$GOOGLE_SERVICE_ACCOUNT_EMAIL" ] || [ -z "$GOOGLE_PRIVATE_KEY" ]; then
                  echo "❌ Cannot fetch new EAB: Missing Google Service Account secrets."
                  exit 1
               fi

               npm install googleapis
               EAB_JSON=$(node src/scripts/fetch-gts-eab.cjs | tail -n 1)
               
               NEW_KID=$(echo "$EAB_JSON" | node -e 'try { console.log(JSON.parse(require("fs").readFileSync(0, "utf-8")).keyId) } catch(e){}')
               NEW_HMAC=$(echo "$EAB_JSON" | node -e 'try { console.log(JSON.parse(require("fs").readFileSync(0, "utf-8")).b64MacKey) } catch(e){}')
               
               if [ -z "$NEW_KID" ] || [ "$NEW_KID" == "undefined" ]; then
                  echo "❌ Failed to parse new EAB credentials."
                  exit 1
               fi

               echo "✅ Obtained new EAB Key ID..."
               
               ~/.acme.sh/acme.sh --register-account \
                  --server https://dv-sxg.acme-v02.api.pki.goog/directory \
                  --eab-kid "$NEW_KID" \
                  --eab-hmac-key "$NEW_HMAC" \
                  --email info@perito.barcelona

               if [ ! -z "$GH_TOKEN" ]; then
                   gh secret set GTS_EAB_KID --body "$NEW_KID" --repo "${{ github.repository }}" || echo "⚠️ Failed to save GTS_EAB_KID secret"
                   gh secret set GTS_EAB_HMAC --body "$NEW_HMAC" --repo "${{ github.repository }}" || echo "⚠️ Failed to save GTS_EAB_HMAC secret"
               fi
            fi

            # Generate Keys & CSR
            openssl ecparam -name prime256v1 -genkey -noout -out .certs/privkey.pem
            
            # Create config using printf to avoid heredoc whitespace issues in YAML
            printf "[ req ]\n" > sxg_openssl.cnf
            printf "distinguished_name = req_distinguished_name\n" >> sxg_openssl.cnf
            printf "req_extensions = v3_req\n" >> sxg_openssl.cnf
            printf "prompt = no\n" >> sxg_openssl.cnf
            printf "[ req_distinguished_name ]\n" >> sxg_openssl.cnf
            printf "CN = $DOMAIN\n" >> sxg_openssl.cnf
            printf "[ v3_req ]\n" >> sxg_openssl.cnf
            printf "subjectAltName = DNS:$DOMAIN\n" >> sxg_openssl.cnf
            printf "1.3.6.1.4.1.11129.2.1.22 = ASN1:NULL\n" >> sxg_openssl.cnf

            openssl req -new -key .certs/privkey.pem -out .certs/domain.csr -config sxg_openssl.cnf

            # Issue Cert
            ~/.acme.sh/acme.sh --signcsr \
              --csr .certs/domain.csr \
              --server https://dv-sxg.acme-v02.api.pki.goog/directory \
              --dns dns_cf \
              --force \
              --dnssleep 60 \
              --fullchain-file .certs/fullchain.pem \
              --cert-file      .certs/cert.pem \
              --ca-file        .certs/ca.pem

            if [ -f .certs/cert.pem ] && [ -f .certs/fullchain.pem ]; then
               echo "✅ Certificate obtained successfully."
               if [ -z "$GH_TOKEN" ]; then echo "Warning: GH_PAT not set"; else
                   # FIX: Save fullchain (leaf+CA) in SXG_CERT_PEM, leaf-only cert separately,
                   # and CA separately so skip-renewal can reconstruct fullchain correctly.
                   gh secret set SXG_CERT_PEM < .certs/fullchain.pem --repo "${{ github.repository }}" || echo "⚠️ Failed to save SXG_CERT_PEM secret"
                   gh secret set SXG_KEY_PEM < .certs/privkey.pem --repo "${{ github.repository }}" || echo "⚠️ Failed to save SXG_KEY_PEM secret"
                   if [ -f .certs/ca.pem ]; then
                     gh secret set SXG_CA_PEM < .certs/ca.pem --repo "${{ github.repository }}" || echo "⚠️ Failed to save SXG_CA_PEM secret"
                   fi
               fi
            fi
          else
            # FIX: Path skip-renewal — reconstruct fullchain.pem from cert + CA
            # The secret SXG_CERT_PEM contains the fullchain (leaf+CA) from the last renewal.
            # We copy it to both fullchain.pem (for cert.cbor) and cert.pem (for signing).
            cp .certs/cert.pem .certs/fullchain.pem

            # FIX: Restore CA from dedicated secret to enable OCSP and proper fullchain validation
            if [ ! -z "$SXG_CA_PEM" ] && [ "$SXG_CA_PEM" != "" ]; then
              echo "$SXG_CA_PEM" > .certs/ca.pem
              echo "✅ CA restored from SXG_CA_PEM secret."
              # Ensure fullchain contains both leaf + CA
              CERT_COUNT=$(grep -c "BEGIN CERTIFICATE" .certs/fullchain.pem || true)
              if [ "$CERT_COUNT" -lt 2 ]; then
                echo "⚠️ fullchain has only $CERT_COUNT cert(s). Appending CA..."
                cat .certs/ca.pem >> .certs/fullchain.pem
              fi
            else
              echo "⚠️ SXG_CA_PEM secret not set. Attempting to fetch CA from AIA extension..."
              ISSUER_URI=$(openssl x509 -in .certs/cert.pem -noout -text 2>/dev/null | grep -i "CA Issuers" | head -n 1 | awk -F "URI:" '{print $2}' | tr -d ' \n\r')
              if [ ! -z "$ISSUER_URI" ]; then
                echo "Downloading Issuer from: $ISSUER_URI"
                wget -q -O .certs/ca.der "$ISSUER_URI" && \
                  (openssl x509 -inform DER -in .certs/ca.der -out .certs/ca.pem 2>/dev/null || mv .certs/ca.der .certs/ca.pem)
                CERT_COUNT=$(grep -c "BEGIN CERTIFICATE" .certs/fullchain.pem || true)
                if [ "$CERT_COUNT" -lt 2 ] && [ -f .certs/ca.pem ]; then
                  cat .certs/ca.pem >> .certs/fullchain.pem
                fi
              else
                echo "⚠️ Could not obtain CA. cert.cbor may be incomplete."
              fi
            fi
            echo "Skip-renewal: fullchain.pem contains $(grep -c 'BEGIN CERTIFICATE' .certs/fullchain.pem || echo '?') certificate(s)."
          fi

      # --- PREPARE CONTENT & CERT.CBOR ---
      - name: Install gen-certurl
        run: |
          # Install Go if needed
          if ! command -v go &> /dev/null; then
             sudo apt-get update && sudo apt-get install -y golang-go
          fi
          go install github.com/WICG/webpackage/go/signedexchange/cmd/gen-certurl@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Generate cert.cbor for Pages
        run: |
          if [ ! -f ".certs/privkey.pem" ]; then
             echo "No private key found, skipping."
             exit 0
          fi
          
          # Ensure CA is present for OCSP issuer check
          if [ ! -f ".certs/ca.pem" ]; then
             echo "⚠️ CA cert missing (cached run). Attempting to fetch correct Issuer..."
             # Extract CA Issuers URI more robustly
             ISSUER_URI=$(openssl x509 -in .certs/cert.pem -noout -text | grep -i "CA Issuers" | head -n 1 | awk -F "URI:" '{print $2}' | tr -d ' \n\r')
             
             if [ ! -z "$ISSUER_URI" ]; then
                echo "Downloading Issuer from: $ISSUER_URI"
                wget -O .certs/ca.der "$ISSUER_URI"
                # Convert DER to PEM
                if ! openssl x509 -inform DER -in .certs/ca.der -out .certs/ca.pem 2>/dev/null; then
                    echo "DER convert failed, trying PEM..."
                    mv .certs/ca.der .certs/ca.pem
                fi
             else 
                echo "⚠️ Could not find Issuer URI in cert. Falling back to GTS Root..."
                wget -O .certs/ca.pem https://pki.goog/repo/certs/gts1d4.pem
             fi
          fi

          # Extract OCSP
          OCSP_URI=$(openssl x509 -noout -ocsp_uri -in .certs/cert.pem)
          OCSP_HOST=$(echo "$OCSP_URI" | awk -F/ '{print $3}')
          echo "OCSP URI: $OCSP_URI"
          echo "OCSP Host: $OCSP_HOST"
          
          if [ -f ".certs/ca.pem" ] && [ ! -z "$OCSP_URI" ]; then
              # Try with explicit Host header (OpenSSL 1.1 syntax: -header key=value)
              if ! openssl ocsp -issuer .certs/ca.pem \
                           -cert .certs/cert.pem \
                           -url "$OCSP_URI" \
                           -header "Host=$OCSP_HOST" \
                           -respout .certs/ocsp.resp \
                           -noverify; then
                  echo "Retry OCSP without explicit header..."
                  openssl ocsp -issuer .certs/ca.pem \
                               -cert .certs/cert.pem \
                               -url "$OCSP_URI" \
                               -respout .certs/ocsp.resp \
                               -noverify || echo "Warning: OCSP fetch failed"
              fi
          else
              echo "❌ Issuer cert missing or OCSP URI empty. Skipping OCSP fetch."
          fi

          echo "Generating cert.cbor..."
          
          # CRITICAL FIX: Ensure fullchain.pem actually contains the full chain (Leaf + CA)
          # If we reused a cert from secrets that only had the leaf, fullchain.pem is just the leaf.
          # We must append the CA.
          CERT_COUNT=$(grep -c "BEGIN CERTIFICATE" .certs/fullchain.pem || true)
          echo "Debug: .certs/fullchain.pem contains $CERT_COUNT certificates."
          
          if [ "$CERT_COUNT" -lt 2 ] && [ -f ".certs/ca.pem" ]; then
             echo "⚠️ Chain incomplete. Appending CA to fullchain..."
             cat .certs/ca.pem >> .certs/fullchain.pem
          fi

          # Note: We use fullchain for the CBOR
          if [ -f .certs/ocsp.resp ]; then
             gen-certurl -pem .certs/fullchain.pem -ocsp .certs/ocsp.resp > dist/cert.cbor
          else
             gen-certurl -pem .certs/fullchain.pem > dist/cert.cbor
          fi

      - name: Install gen-signedexchange
        run: |
          go install github.com/WICG/webpackage/go/signedexchange/cmd/gen-signedexchange@latest
          go install github.com/WICG/webpackage/go/signedexchange/cmd/dump-signedexchange@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Generate SXG Files
        run: |
          echo "Generating SXG files statically..."
          mkdir -p dist
          # Run the Node.js script (CommonJS)
          node src/scripts/generate-sxg.cjs

      - name: Validate cert-sha256 coherence (SXG vs cert.cbor)
        run: |
          echo "=== Validating cert-sha256 coherence ==="

          # Extract the sha256 of the leaf cert from fullchain.pem (same as used in cert.cbor)
          LEAF_CERT_SHA256=$(openssl x509 -in .certs/fullchain.pem -outform DER 2>/dev/null | openssl dgst -sha256 -binary | base64 | tr '+/' '-_' | tr -d '=')
          echo "Leaf cert sha256 (base64url): $LEAF_CERT_SHA256"

          # Find a sample SXG and extract its cert-sha256 using gen-signedexchange dump
          SAMPLE_SXG=$(find dist -name '*.sxg' | head -n 1)
          if [ -z "$SAMPLE_SXG" ]; then
            echo "⚠️ No SXG files found in dist/. Skipping validation."
            exit 0
          fi
          echo "Checking sample SXG: $SAMPLE_SXG"

          # dump-signedexchange prints cert-sha256 among other fields
          SXG_CERT_SHA256=$(dump-signedexchange -uri "$SAMPLE_SXG" 2>/dev/null | grep -i 'cert-sha256' | head -n 1 | awk -F ':' '{print $2}' | tr -d ' ' || true)

          if [ ! -z "$SXG_CERT_SHA256" ]; then
            echo "SXG embedded cert-sha256: $SXG_CERT_SHA256"
            if [ "$SXG_CERT_SHA256" = "$LEAF_CERT_SHA256" ]; then
              echo "✅ cert-sha256 MATCH — SXG and cert.cbor are coherent."
            else
              echo "❌ cert-sha256 MISMATCH!"
              echo "  SXG:    $SXG_CERT_SHA256"
              echo "  cbor:   $LEAF_CERT_SHA256"
              echo "This will cause browser verification failure. Aborting deploy."
              exit 1
            fi
          else
            echo "⚠️ Could not extract cert-sha256 from SXG (dump-signedexchange may not support -uri for files)."
            echo "Proceeding with deploy — monitor browser DevTools for cert-sha256 mismatch errors."
          fi



      - name: Deploy Content to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: pb
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

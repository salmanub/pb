
name: Cloudflare Pages & SXG Deployment

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 0 * * 1' # Renew check weekly
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write
  deployments: write

env:
  DOMAIN: perito.barcelona

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      # --- CERTIFICATE MANAGEMENT (ACME.SH + GTS) ---
      - name: Install acme.sh
        run: |
          wget -O -  https://get.acme.sh | sh -s email=info@perito.barcelona
          
      - name: Issue/Renew Certificate (GTS) with Auto-Recovery
        env:
          CF_Token: ${{ secrets.CF_DNS_API_TOKEN }}
          CF_Account_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p .certs
          
          # Restore certs from secrets if available
          if [ ! -z "${{ secrets.SXG_CERT_PEM }}" ]; then
            echo "${{ secrets.SXG_CERT_PEM }}" > .certs/cert.pem
            echo "${{ secrets.SXG_KEY_PEM }}" > .certs/key.pem
          fi

          # Attempt 1: Register with existing secrets
          set +e
          ~/.acme.sh/acme.sh --register-account \
            --server google \
            --eab-kid "${{ secrets.GTS_EAB_KID }}" \
            --eab-hmac-key "${{ secrets.GTS_EAB_HMAC }}" \
            --email info@perito.barcelona
          REG_STATUS=$?
          set -e

          # If registration failed, try to fetch new EAB credentials
          if [ $REG_STATUS -ne 0 ]; then
             echo "⚠️ Registration failed or keys expired. Attempting to fetch new EAB credentials via Service Account..."
             
             if [ -z "$GOOGLE_SERVICE_ACCOUNT_EMAIL" ] || [ -z "$GOOGLE_PRIVATE_KEY" ]; then
                echo "❌ Cannot fetch new EAB: Missing Google Service Account secrets."
                exit 1
             fi

             # Run fetch script and capture the last line (JSON)
             EAB_JSON=$(node src/scripts/fetch-gts-eab.js | tail -n 1)
             
             # Parse JSON using node
             NEW_KID=$(echo "$EAB_JSON" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf-8")).keyId)')
             NEW_HMAC=$(echo "$EAB_JSON" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf-8")).b64MacKey)')
             
             if [ -z "$NEW_KID" ] || [ "$NEW_KID" == "undefined" ]; then
                echo "❌ Failed to parse new EAB credentials."
                exit 1
             fi

             echo "✅ Obtained new EAB Key ID: ${NEW_KID:0:5}..."
             
             # Attempt 2: Register with new credentials
             ~/.acme.sh/acme.sh --register-account \
                --server google \
                --eab-kid "$NEW_KID" \
                --eab-hmac-key "$NEW_HMAC" \
                --email info@perito.barcelona

             # Update GitHub Secrets for future runs
             gh secret set GTS_EAB_KID --body "$NEW_KID" --repo "${{ github.repository }}"
             gh secret set GTS_EAB_HMAC --body "$NEW_HMAC" --repo "${{ github.repository }}"
             echo "✅ GitHub Secrets updated with new EAB credentials."
          fi

          # Issue or Renew Certificate
          ~/.acme.sh/acme.sh --issue \
            --server google \
            --domain "$DOMAIN" \
            --dns dns_cf \
            --keylength ec-256 \
            --days 60 \
            --force \
            --fullchain-file .certs/fullchain.pem \
            --key-file       .certs/privkey.pem \
            --cert-file      .certs/cert.pem \
            --ca-file        .certs/ca.pem

          # If successful, export certs to secrets
          if [ -f .certs/privkey.pem ]; then
             echo "✅ Certificate obtained successfully."
             # Use gh cli to update secrets
             if [ -z "$GH_TOKEN" ]; then echo "Warning: GH_PAT not set, skipping secret update"; else
                 gh secret set SXG_CERT_PEM < .certs/cert.pem --repo "${{ github.repository }}"
                 gh secret set SXG_KEY_PEM < .certs/privkey.pem --repo "${{ github.repository }}"
             fi
          fi

      # --- SXG GENERATION ---
      - name: Install gen-signedexchange & gen-certurl
        run: |
          # Install using Go
          if ! command -v go &> /dev/null; then
             echo "Go not found, installing..."
             sudo apt-get update && sudo apt-get install -y golang-go
          fi
          
          go install github.com/WICG/webpackage/go/signedexchange/cmd/gen-signedexchange@latest
          go install github.com/WICG/webpackage/go/signedexchange/cmd/gen-certurl@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Generate SXG Files
        run: |
          # 1. Generate Certificate Chain (CBOR) with OCSP Stapling
          
          if [ ! -f ".certs/privkey.pem" ]; then
             echo "No private key found, skipping SXG generation."
             exit 0
          fi

          echo "Fetching OCSP response..."
          # Extract OCSP URI
          OCSP_URI=$(openssl x509 -noout -ocsp_uri -in .certs/cert.pem)
          echo "OCSP URI: $OCSP_URI"
          
          # Fetch OCSP response
          # We use the CA file we requested from acme.sh as issuer
          openssl ocsp -issuer .certs/ca.pem \
                       -cert .certs/cert.pem \
                       -url "$OCSP_URI" \
                       -respout .certs/ocsp.resp \
                       -noverify || echo "Warning: OCSP fetch failed or verification skipped"

          echo "Generating cert.cbor with stapled OCSP..."
          if [ -f .certs/ocsp.resp ]; then
             gen-certurl -pem .certs/fullchain.pem -ocsp .certs/ocsp.resp > dist/cert.cbor
          else
             echo "Warning: No OCSP response available. Generating without stapling (might fail in Google Cache)."
             gen-certurl -pem .certs/fullchain.pem > dist/cert.cbor
          fi
          
          CERT_FILE=".certs/cert.pem"
          KEY_FILE=".certs/privkey.pem"
          export CERT_URL="https://$DOMAIN/cert.cbor"
          
          echo "Generating SXG files for $DOMAIN... using Cert URL: $CERT_URL"
          echo "Runnning parallel generation script..."
          
          # Run the parallel Node.js script
          # Pass valid env vars just in case we enhance it later
          export DOMAIN="$DOMAIN"
          node src/scripts/generate-sxg.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: pb # Updated to match user request
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
